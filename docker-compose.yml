services:
  back:
    build: ./Back
    env_file: ./Back/.env
    environment:
      PORT: "5000"
    restart: unless-stopped

  front:
    build: ./Front
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - back
      - front
    restart: unless-stopped
