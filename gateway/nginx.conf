# ============================================================
# API Gateway: จุดเข้าเดียวของระบบ Grand Service
#   - Routing: ส่ง request ไปยัง Microservice ที่เป็นเจ้าของ path นั้น
#   - JWT Authentication: ตรวจ token กับ Auth Service ก่อนส่งต่อ (auth_request)
#   - Rate Limiting: จำกัดจำนวน request ต่อ IP
# ============================================================

limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;

# หา IP ของแต่ละ service ผ่าน DNS ของ Docker ทุก 10 วินาที (service รีสตาร์ทแล้ว Gateway ยังหาเจอ)
resolver 127.0.0.11 valid=10s ipv6=off;

# path -> service ที่รับผิดชอบ
map $uri $api_upstream {
  ~^/api/auth/                                   auth:5001;
  ~^/api/admin/users                             auth:5001;
  ~^/api/(products|brands|categories)            catalog:5002;
  ~^/api/admin/(products|brands|categories)      catalog:5002;
  ~^/api/inventory                               inventory:5003;
  ~^/api/admin/inventory                         inventory:5003;
  ~^/api/(bookings|locations|notifications)      booking:5004;
  ~^/api/admin/(bookings|locations)              booking:5004;
  ~^/api/admin/(stats|audit-logs)                admin:5005;
  default                                        "";
}

server {
  listen 80;
  client_max_body_size 30m;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ---------- JWT check (เรียกภายใน Gateway เท่านั้น) ----------
  # ไม่บังคับ login: มี token ก็ส่งตัวตนต่อให้ service, ไม่มีก็ผ่านได้ (หน้าร้าน)
  location = /_auth {
    internal;
    set $auth_svc auth:5001;
    proxy_pass http://$auth_svc/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }
  # บังคับ login: ไม่มี token หรือ token ไม่ถูกต้อง = 401 ที่ Gateway ไม่ถึง service
  location = /_auth_required {
    internal;
    set $auth_svc auth:5001;
    proxy_pass http://$auth_svc/api/auth/check?required=1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  # ---------- login / สมัคร / ลืมรหัส: rate limit เข้ม ----------
  location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
    limit_req zone=auth burst=3 nodelay;
    proxy_pass http://auth:5001;
  }

  # ---------- หลังร้าน: ต้องผ่าน JWT ที่ Gateway ----------
  location /api/admin/ {
    limit_req zone=api burst=40 nodelay;
    auth_request /_auth_required;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    proxy_set_header X-User-Id   $user_id;
    proxy_set_header X-User-Role $user_role;
    if ($api_upstream = "") { return 404; }
    proxy_pass http://$api_upstream;
  }

  # ---------- API อื่น ----------
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    auth_request /_auth;
    auth_request_set $user_id   $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    proxy_set_header X-User-Id   $user_id;
    proxy_set_header X-User-Role $user_role;
    if ($api_upstream = "") { return 404; }
    proxy_pass http://$api_upstream;
  }

  # API ภายในระหว่าง service ห้ามเรียกจากข้างนอก
  location /internal/ { return 404; }

  # ---------- หน้าเว็บ ----------
  location / {
    set $front front:80;
    proxy_pass http://$front;
  }
}
